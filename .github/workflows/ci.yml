name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path selector: the code tests only matter when code changed. Preset contents
  # (skills, prompts, docs) ship to users without touching the launcher, so a
  # preset-only change skips them. This job always runs and reports, which keeps
  # a stable status check instead of a workflow that silently never appears.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Decide whether code changed
        run: |
          set -eu
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'Manual run: testing everything.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.event.after }}'
          fi

          # A new branch or a force push leaves `before` at all zeros (or at a
          # commit this clone never had). Test everything rather than guess.
          if [ -z "$head" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo 'Unknown base commit: testing everything.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$base" "$head")
          echo 'Changed files:'
          echo "$files" | sed 's/^/  /'

          # Launcher source, tests, tooling and preset manifests are code: the
          # test suite asserts on the manifests, so editing one must run it.
          if echo "$files" | grep -Eq '^(src/|test/|\.github/|package\.json$|package-lock\.json$|tsconfig\.json$|(coding|office|design)/package\.json$)'; then
            echo 'Code or manifests changed: testing.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Only preset contents or docs changed: skipping the test matrix.'
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm

      # postinstall installs each preset's own dependencies, which is the same
      # path a user takes and exercises src/install-presets.ts on both OSes.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
